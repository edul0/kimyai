name: Build Kemy Desktop (.exe)

# Gera o executavel Windows do assistente de voz local.
# Roda no runner windows-latest (PyInstaller nao faz cross-compile a partir do Linux).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/happy-sagan-kqbec4
    paths:
      - "local_app/**"
      - "app/**"
      - "static/**"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements-cloud.txt
          python -m pip install -r local_app/requirements.txt

      - name: Write bundled .env from secrets
        shell: pwsh
        env:
          KEMY_ENV: ${{ secrets.KEMY_ENV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_PRIMARY_MODEL: ${{ secrets.GEMINI_PRIMARY_MODEL }}
        run: |
          # Comeca do KEMY_ENV (se existir) e SEMPRE junta as chaves individuais por cima,
          # pra nenhuma ser ignorada. Chaves individuais sobrescrevem as do KEMY_ENV.
          if ($env:KEMY_ENV) {
            $env:KEMY_ENV | Out-File -Encoding ascii kemy_bundled.env
            Write-Host "KEMY_ENV embutido no .exe."
          } else {
            "" | Out-File -Encoding ascii kemy_bundled.env
          }
          foreach ($k in @("GEMINI_API_KEY","GROQ_API_KEY","CEREBRAS_API_KEY","NVIDIA_API_KEY","MISTRAL_API_KEY","GITHUB_MODELS_TOKEN","SAMBANOVA_API_KEY","OPENROUTER_API_KEY","OPENAI_API_KEY","GEMINI_PRIMARY_MODEL")) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($v) { Add-Content -Encoding ascii kemy_bundled.env "`n$k=$v" }
          }
          $content = Get-Content kemy_bundled.env -Raw
          if ($content -notmatch "LLM_MODE") { Add-Content -Encoding ascii kemy_bundled.env "`nLLM_MODE=providers" }
          $nkeys = (Select-String -Path kemy_bundled.env -Pattern "_API_KEY=" -AllMatches).Matches.Count
          Write-Host "Chaves embutidas no .exe: $nkeys"
          "${{ github.sha }}" | Out-File -Encoding ascii -NoNewline kemy_version.txt

      - name: Build .exe
        shell: pwsh
        run: .\local_app\build_exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KemyDesktop-windows
          path: dist/KemyDesktop
          if-no-files-found: error
          retention-days: 30

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist/KemyDesktop/* -DestinationPath KemyDesktop-windows.zip -Force

      - name: Publish Release (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Kemy Desktop (ultima build)
          body: |
            Build automatica do assistente de voz Kemy (Windows).
            Baixe o KemyDesktop-windows.zip, extraia e rode KemyDesktop.exe.
            sha: ${{ github.sha }}
          files: KemyDesktop-windows.zip
          fail_on_unmatched_files: true
