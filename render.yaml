# ║         KEMY AI — Configuração Render.com                     ║
# ║   Conectar GitHub e Render detecta este arquivo auto          ║
# ╚══════════════════════════════════════════════════════════════╝

services:
  - type: web
    name: kemy-ai
    runtime: docker
    region: ohio
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: FREE_ONLY
        value: true
      - key: LLM_MODE
        value: mock
      - key: KIMI_SUPABASE_URL
        sync: false
      - key: KIMI_SUPABASE_ANON_KEY
        sync: false
      - key: KIMI_SUPABASE_SERVICE_ROLE_KEY
        sync: false
    
  # Adicionar Redis em Render.com dashboard manualmente
  # ou usar Redis externo (Redis Cloud, Upstash)
