services:
  - type: web
    name: kemy-ai
    runtime: docker
    region: ohio
    plan: free
    healthCheckPath: /api/status
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AMBIENTE
        value: production
      - key: PORT
        value: "8000"
      - key: FREE_ONLY
        value: "true"
      - key: LLM_MODE
        value: providers
      - key: ORIGENS_CORS
        value: "*"
      - key: KEMY_AUTH_USER
        value: admin
      - key: KEMY_AUTH_PASSWORD
        sync: false
      - key: KEMY_AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: BROWSERLESS_API_KEY
        sync: false
      - key: BROWSERLESS_URL
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: KIMI_SUPABASE_URL
        sync: false
      - key: KIMI_SUPABASE_ANON_KEY
        sync: false
      - key: KIMI_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOTENBERG_TIMEOUT_SECONDS
        value: "90"
