<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemy — Avatar (OBS / Desktop)</title>
<style>
  /* Fundo TRANSPARENTE (OBS Browser Source e janela mascote). */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  *{box-sizing:border-box}
  .stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding-bottom:2vh}
  /* Live2D (VTuber real) */
  #l2dwrap{width:100%;height:92vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #l2d{width:100%;height:100%}
  /* Avatar SVG (reserva enquanto o Live2D nao carrega / se falhar) */
  .avatar{width:46vh;height:46vh;max-width:90vw;position:relative;animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
  .halo{position:absolute;inset:-6%;border-radius:50%;
    background:radial-gradient(circle, rgba(60,231,200,.30), rgba(60,231,200,0) 68%);
    filter:blur(8px);opacity:.6;transition:opacity .3s}
  body.speaking .halo{opacity:1;animation:pulse 1.1s ease-in-out infinite}
  body.thinking .halo{opacity:.85;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.05);opacity:1}}
  .avatar svg{position:absolute;inset:0;width:100%;height:100%}
  .iris{fill:#1fd6c8}
  .gem{fill:#3ce7c8;filter:drop-shadow(0 0 5px rgba(60,231,200,.9))}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
  .mouth{transform-box:fill-box;transform-origin:center;transition:transform .05s linear}
  .statelbl{font-family:'Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:.5px;
    color:#eafff9;text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 18px rgba(60,231,200,.4);
    font-size:clamp(14px,3.2vh,24px);opacity:.92}
  body.hidelbl .statelbl{display:none}
</style>
</head>
<body class="idle">
  <div class="stage">
    <div id="l2dwrap" style="display:none"><canvas id="l2d"></canvas></div>
    <div class="avatar" id="svgAvatar">
      <div class="halo"></div>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <path d="M40 96 Q28 180 70 168 Q100 182 130 168 Q172 180 160 96 Q150 30 100 26 Q50 30 40 96Z" fill="#1a1030"/>
        <ellipse cx="100" cy="104" rx="42" ry="50" fill="#ece1f2"/>
        <rect x="48" y="96" width="14" height="34" rx="7" fill="#120a1f"/>
        <rect x="138" y="96" width="14" height="34" rx="7" fill="#120a1f"/>
        <circle cx="55" cy="113" r="5" class="iris"/><circle cx="145" cy="113" r="5" class="iris"/>
        <path d="M55 96 Q44 36 100 30 Q156 36 145 96 Q132 70 116 78 Q100 104 84 78 Q68 70 55 96Z" fill="#211433"/>
        <path d="M100 64 l6 7 l-6 8 l-6 -8 Z" class="gem"/>
        <path d="M74 100 q10 -7 22 -2" stroke="#120a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M104 98 q12 -5 22 2" stroke="#120a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g class="eye"><ellipse cx="85" cy="110" rx="9" ry="10" fill="#f3ecff"/><circle class="iris" cx="85" cy="110" r="5.5"/><circle cx="87" cy="108" r="1.8" fill="#fff"/></g>
        <g class="eye"><ellipse cx="115" cy="110" rx="9" ry="10" fill="#f3ecff"/><circle class="iris" cx="115" cy="110" r="5.5"/><circle cx="117" cy="108" r="1.8" fill="#fff"/></g>
        <ellipse cx="80" cy="126" rx="6" ry="3" fill="#b06a8f" opacity=".6"/>
        <ellipse cx="120" cy="126" rx="6" ry="3" fill="#b06a8f" opacity=".6"/>
        <ellipse class="mouth" id="mouth" cx="100" cy="136" rx="7" ry="5" fill="#6e2440"/>
      </svg>
    </div>
    <div class="statelbl" id="lbl">Pronta</div>
  </div>
<script>
  var qs = new URLSearchParams(location.search);
  if (qs.get('nolabel') === '1') document.body.classList.add('hidelbl');
  var LABELS = {idle:'Pronta', thinking:'Pensando…', speaking:'Falando…', offline:'Offline'};
  var mouthEl = document.getElementById('mouth'), lbl = document.getElementById('lbl');
  var curState = 'idle', lastMouth = -1, t = 0;

  function baseClass(){ return (qs.get('nolabel')==='1' ? 'hidelbl ' : ''); }
  function setState(s){
    if(!s) s='idle';
    if(s!==curState){ curState=s; document.body.className=baseClass()+s; lbl.textContent=qs.get('label')||LABELS[s]||'Pronta';
      try{ var m=window._l2dModel; if(m){ if(s==='speaking'&&m.motion)m.motion('TapBody'); else if(s==='idle'&&m.motion)m.motion('Idle'); if(m.expression&&s!=='idle')m.expression(); } }catch(e){} }
  }
  function setMouthSVG(v){ v=Math.max(0,Math.min(1,+v||0));
    mouthEl.style.transform='scaleY('+(1+v*1.8)+') scaleX('+(1-v*0.15)+')'; }

  // ---- VTuber Live2D (mesmo modelo do app). Cai pro SVG se falhar. ----
  window._mouth = 0;
  function _loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  function loadLive2D(){
    _loadScript("https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js")
      .then(function(){ return _loadScript("https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"); })
      .then(function(){ return _loadScript("https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"); })
      .then(initL2D)
      .catch(function(e){ console.log('Live2D libs falharam, mantendo SVG:',e); });
  }
  function initL2D(){
    try{
      if(!window.PIXI||!window.PIXI.live2d) return;
      var MODEL = qs.get('model') || "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json";
      var wrap=document.getElementById('l2dwrap');
      var app=new PIXI.Application({view:document.getElementById('l2d'),resizeTo:wrap,backgroundAlpha:0,antialias:true});
      PIXI.live2d.Live2DModel.from(MODEL).then(function(model){
        app.stage.addChild(model);
        window._l2dModel = model;
        function fit(){ var w=app.renderer.width,h=app.renderer.height;
          model.anchor.set(0.5,1.0); var s=(h/model.height)*0.98; model.scale.set(s); model.x=w/2; model.y=h; }
        fit(); window.addEventListener('resize',fit);
        // mostra o Live2D e esconde o SVG
        wrap.style.display='flex'; document.getElementById('svgAvatar').style.display='none';
        app.ticker.add(function(){
          try{ model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', window._mouth); }catch(e){}
        });
      }).catch(function(e){ console.log('Live2D model falhou, usando SVG:',e); });
    }catch(e){ console.log('Live2D init falhou, usando SVG:',e); }
  }

  // boca falando: usa mouth do /state; se nao vier, oscila enquanto 'speaking'
  function tick(){ t+=0.35;
    var m = 0;
    if(curState==='speaking'){ m = (lastMouth>=0) ? lastMouth : (0.5+0.5*Math.sin(t*6)); }
    window._mouth = m; setMouthSVG(m);
    requestAnimationFrame(tick);
  }
  function poll(){
    fetch('/state',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      setState(d.state);
      lastMouth = (typeof d.mouth==='number') ? d.mouth : -1;
    }).catch(function(){});
  }
  setInterval(poll,120); poll(); tick();
  setTimeout(loadLive2D, 800);
</script>
</body>
</html>
