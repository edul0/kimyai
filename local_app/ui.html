<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kemy</title>
<style>
  :root{
    --bg:#070a12; --bg2:#0b1020; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.08); --text:#eaf0ff; --muted:#8a98b8;
    --accent:#7c5cff; --accent2:#22e0c8; --user:#9fe7d2;
    --idle:#22e0c8; --listening:#5ab0ff; --thinking:#ffc857; --speaking:#b98bff; --error:#ff6b6b;
    --st:var(--idle);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(34,224,200,.12), transparent 60%),
      linear-gradient(160deg,#070a12,#0b1020);
    overflow:hidden;
  }
  .app{display:grid;grid-template-columns:248px 1fr;height:100vh}
  /* sidebar */
  .side{background:rgba(0,0,0,.25);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
  .brand b{font-size:20px;letter-spacing:.5px}
  .brand small{color:var(--muted)}
  .newbtn{border:0;border-radius:14px;padding:12px;font-weight:700;color:#08111a;cursor:pointer;
    background:linear-gradient(135deg,var(--accent2),#5ad8ff);box-shadow:0 8px 24px rgba(34,224,200,.25);transition:.2s}
  .newbtn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .lbl{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px;padding:4px 6px}
  .convos{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
  .conv{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 10px;color:var(--muted);cursor:pointer;transition:.15s}
  .conv:hover{background:var(--panel);color:var(--text)}
  .conv.active{background:var(--panel2);color:var(--text);border-color:var(--line)}
  .conv .bar{width:3px;align-self:stretch;border-radius:3px;background:transparent}
  .conv.active .bar{background:linear-gradient(var(--accent),var(--accent2))}
  .conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
  .conv .del{opacity:.5;border:0;background:none;color:inherit;cursor:pointer;font-size:13px}
  .conv .del:hover{opacity:1;color:var(--error)}
  /* main */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;overflow:hidden}
  .top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .top .sp{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--st);box-shadow:0 0 12px var(--st);transition:.2s}
  .iconbtn{position:relative;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;transition:.15s}
  .iconbtn:hover{background:var(--panel2);color:var(--text);transform:translateY(-1px)}
  .badge{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#ff4d4d;
    box-shadow:0 0 8px #ff4d4d;display:none;animation:pulse 1.2s ease-in-out infinite}
  /* avatar */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0 8px;gap:6px}
  .avatar{width:210px;height:210px;position:relative}
  .l2dwrap{width:300px;height:340px;display:flex;align-items:center;justify-content:center}
  #l2d{width:100%;height:100%}
  .statelbl{font-size:13px;font-weight:700;color:var(--st);letter-spacing:.4px;opacity:.9}
  .halo{position:absolute;inset:0;border-radius:50%;border:2px solid var(--st);opacity:.5;
    box-shadow:0 0 30px var(--st);animation:breathe 3.5s ease-in-out infinite}
  body.listening .halo,body.speaking .halo{animation:pulse 1.1s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.05);opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.9}}
  .avatar svg{position:absolute;inset:0;width:100%;height:100%;animation:bob 4s ease-in-out infinite}
  .vtspanel{align-items:center;gap:14px;padding:14px 22px;border-radius:16px;background:rgba(120,90,220,.12);border:1px solid rgba(150,120,255,.3)}
  .vtsface{font-size:42px;animation:bob 4s ease-in-out infinite}
  .vtstxt{font-size:14px;color:#cfc4ff;line-height:1.4}
  .vtstxt small{color:#9a8fc8}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .eye{transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .iris{fill:var(--st);filter:drop-shadow(0 0 4px var(--st))}
  .gem{fill:var(--st);filter:drop-shadow(0 0 5px var(--st));animation:breathe 2.4s ease-in-out infinite}
  .mouth{transform-origin:center;transform:scaleY(.35)}
  body.speaking .mouth{animation:talk .28s steps(2) infinite}
  @keyframes talk{0%{transform:scaleY(.3)}50%{transform:scaleY(1.1)}100%{transform:scaleY(.5)}}
  /* chat */
  .chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 22px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.55;font-size:14px;white-space:pre-wrap;word-wrap:break-word;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,224,200,.12));border:1px solid var(--line)}
  .msg.kemy{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;font-style:italic;padding:2px}
  .msg .save{margin-top:8px;font-size:12px;color:var(--accent2);font-weight:700}
  /* composer */
  .composer{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px;align-items:center}
  .input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--text);font-size:14px;outline:none;transition:.15s}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
  .send{border:0;border-radius:14px;padding:13px 22px;font-weight:700;color:#08111a;cursor:pointer;background:linear-gradient(135deg,var(--accent2),#5ad8ff);transition:.2s}
  .send:hover{transform:translateY(-2px)}
  .toggles{display:flex;gap:8px;align-items:center}
  .talk{border:0;border-radius:12px;padding:11px 20px;font-weight:700;color:#08111a;cursor:pointer;background:linear-gradient(135deg,var(--listening),#7cc4ff);transition:.2s}
  .talk:hover{transform:translateY(-2px)}
  .tg{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
  .tg.on{color:#08111a}
  .tg.conv.on{background:var(--accent2)}
  .tg.auto.on{background:var(--thinking)}
  .tg.mute{margin-left:auto}
  .chat::-webkit-scrollbar,.convos::-webkit-scrollbar{width:12px}
  .chat::-webkit-scrollbar-track,.convos::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
  .chat::-webkit-scrollbar-thumb,.convos::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .chat::-webkit-scrollbar-thumb:hover,.convos::-webkit-scrollbar-thumb:hover{background:var(--accent2)}
</style>
</head>
<body class="idle">
  <div class="app">
    <aside class="side">
      <div class="brand"><b>Kemy</b><small>· local</small></div>
      <button class="newbtn" onclick="api('new_convo')">＋ Nova conversa</button>
      <div class="lbl">CONVERSAS</div>
      <div class="convos" id="convos"></div>
      <button class="iconbtn" style="width:100%" onclick="api('choose_workspace')">🗂 Escolher pasta</button>
      <button class="iconbtn" style="width:100%" onclick="api('open_folder')">📁 Abrir pasta</button>
    </aside>
    <section class="main">
      <div class="top">
        <span class="pill"><span class="dot"></span><span id="stateTxt">Conectando…</span></span>
        <span class="sp"></span>
        <button class="iconbtn" onclick="openVoice()">🎙️ Voz</button>
        <button class="iconbtn" onclick="api('preview')">👁 Preview</button>
        <button class="iconbtn" onclick="api('vts_connect')">🎭 VTuber</button>
        <button class="iconbtn" onclick="api('vts_test')" title="Testa a boca do modelo no VTube Studio">👄 Testar boca</button>
        <button class="iconbtn" id="updBtn" onclick="doUpdate()">⬆ Atualizar<span class="badge" id="updBadge"></span></button>
      </div>
      <div class="stage">
        <div class="l2dwrap" id="l2dwrap" style="display:none"><canvas id="l2d"></canvas></div>
        <div class="avatar" id="svgAvatar">
          <div class="halo"></div>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <!-- cabelo de tras -->
            <path d="M40 96 Q28 180 70 168 Q100 182 130 168 Q172 180 160 96 Q150 30 100 26 Q50 30 40 96Z" fill="#1a1030"/>
            <!-- rosto -->
            <ellipse cx="100" cy="104" rx="42" ry="50" fill="#ece1f2"/>
            <!-- pods -->
            <rect x="48" y="96" width="14" height="34" rx="7" fill="#120a1f"/>
            <rect x="138" y="96" width="14" height="34" rx="7" fill="#120a1f"/>
            <circle cx="55" cy="113" r="5" class="iris"/><circle cx="145" cy="113" r="5" class="iris"/>
            <!-- franja cobrindo a coroa -->
            <path d="M55 96 Q44 36 100 30 Q156 36 145 96 Q132 70 116 78 Q100 104 84 78 Q68 70 55 96Z" fill="#211433"/>
            <!-- gema -->
            <path d="M100 64 l6 7 l-6 8 l-6 -8 Z" class="gem"/>
            <!-- delineado -->
            <path d="M74 100 q10 -7 22 -2" stroke="#120a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M104 98 q12 -5 22 2" stroke="#120a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- olhos -->
            <g class="eye"><ellipse cx="85" cy="110" rx="9" ry="10" fill="#f3ecff"/><circle class="iris" cx="85" cy="110" r="5.5"/><circle cx="87" cy="108" r="1.8" fill="#fff"/></g>
            <g class="eye"><ellipse cx="115" cy="110" rx="9" ry="10" fill="#f3ecff"/><circle class="iris" cx="115" cy="110" r="5.5"/><circle cx="117" cy="108" r="1.8" fill="#fff"/></g>
            <!-- blush -->
            <ellipse cx="80" cy="126" rx="6" ry="3" fill="#b06a8f" opacity=".6"/>
            <ellipse cx="120" cy="126" rx="6" ry="3" fill="#b06a8f" opacity=".6"/>
            <!-- boca -->
            <ellipse class="mouth" cx="100" cy="136" rx="7" ry="5" fill="#6e2440"/>
          </svg>
        </div>
        <div class="statelbl" id="statelbl">Pronta</div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="composer">
        <div class="row">
          <button class="iconbtn" title="Enviar uma imagem para a Kemy ver" onclick="api('analyze_image', document.getElementById('inp').value)">📎</button>
          <input class="input" id="inp" placeholder="Peça algo: crie um site, edite o código, abra um app…" />
          <button class="send" onclick="sendText()">Enviar</button>
        </div>
        <div class="toggles">
          <button class="talk" id="talk" onclick="api('listen')">🎙 Falar</button>
          <button class="tg conv" id="tgConv" onclick="toggle('conv')">💬 Conversa</button>
          <button class="tg auto" id="tgAuto" onclick="toggle('auto')">⚡ Auto</button>
          <button class="tg mute" onclick="api('stop_speak')">🔇 Silenciar</button>
        </div>
      </div>
    </section>
  </div>
  <div id="voiceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;align-items:center;justify-content:center">
    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:24px;width:440px;max-width:92%">
      <h3 style="margin:0 0 6px">🎙️ Voz personalizada (ElevenLabs)</h3>
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Cole a chave da API e o Voice ID. Deixe o ID vazio para usar a voz padrão.</p>
      <input id="vKey" class="input" placeholder="Chave da API (xi-api-key)" style="width:100%;margin-bottom:10px;box-sizing:border-box"/>
      <input id="vVoice" class="input" placeholder="Voice ID (ex.: 33B4UnXyTNbgLmdEDh5P)" style="width:100%;margin-bottom:16px;box-sizing:border-box"/>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="tg" onclick="closeVoice()">Cancelar</button>
        <button class="send" onclick="saveVoice()">Salvar e testar</button>
      </div>
    </div>
  </div>
<script>
  function openVoice(){ document.getElementById('voiceModal').style.display='flex'; }
  function closeVoice(){ document.getElementById('voiceModal').style.display='none'; }
  function saveVoice(){ var k=document.getElementById('vKey').value.trim(), v=document.getElementById('vVoice').value.trim();
    if(!k){ return; } api('set_voice', k+'|'+v); closeVoice(); }
</script>
<script>
  const STATE_TXT={idle:"Pronta",listening:"Ouvindo…",thinking:"Pensando…",speaking:"Falando…",offline:"Conectando…",error:"Erro"};
  function api(name,arg){ if(!(window.pywebview&&pywebview.api&&pywebview.api[name]))return;
    return arg===undefined?pywebview.api[name]():pywebview.api[name](arg); }
  function kemyState(s){ document.body.className=s;
    document.getElementById("stateTxt").textContent=STATE_TXT[s]||s;
    var l=document.getElementById("statelbl"); if(l) l.textContent=STATE_TXT[s]||s; }
  function vtsConnected(){ /* o rosto e a carinha do app; nao escondemos mais */ }
  function addMsg(role,text,save){
    const c=document.getElementById("chat");
    const d=document.createElement("div"); d.className="msg "+role;
    d.textContent=text;
    if(save){const s=document.createElement("div");s.className="save";s.textContent="💾 "+save;d.appendChild(s);}
    c.appendChild(d); c.scrollTop=c.scrollHeight;
  }
  function clearChat(){document.getElementById("chat").innerHTML="";}
  function renderConvos(list,active){
    const box=document.getElementById("convos"); box.innerHTML="";
    list.forEach(it=>{
      const d=document.createElement("div"); d.className="conv"+(it.id===active?" active":"");
      d.innerHTML='<span class="bar"></span><span class="t"></span><button class="del">🗑</button>';
      d.querySelector(".t").textContent=it.title||"Nova conversa";
      d.onclick=e=>{ if(e.target.classList.contains("del")){api('delete_convo',it.id);} else {api('select_convo',it.id);} };
      box.appendChild(d);
    });
  }
  function setToggle(name,on){ const b=document.getElementById(name==="conv"?"tgConv":"tgAuto"); b.classList.toggle("on",on);
    b.textContent=(name==="conv"?"💬 Conversa":"⚡ Auto")+(on?": ON":""); }
  function toggle(name){ api('toggle',name); }
  function sendText(){ const i=document.getElementById("inp"); const t=i.value.trim(); if(!t)return; i.value=""; api('send_text',t); }
  document.getElementById("inp").addEventListener("keydown",e=>{ if(e.key==="Enter")sendText(); });
  function doUpdate(){ addMsg("sys","Procurando atualização…"); api('check_update'); }
  function setUpdate(av){ const b=document.getElementById("updBadge"); if(b)b.style.display=av?"block":"none"; }
  // boot — robusto: funciona mesmo se 'pywebviewready' disparar antes do listener
  var _booted=false;
  function boot(){
    if(_booted) return;
    if(!(window.pywebview && window.pywebview.api && pywebview.api.bootstrap)){ return setTimeout(boot,150); }
    _booted=true;
    pywebview.api.bootstrap().then(function(st){
      renderConvos(st.convos,st.active); kemyState(st.state||"idle");
      (st.log||[]).forEach(function(m){ addMsg(m.r,m.t); });
      // rede de seguranca: se continuar "Conectando", consulta o estado
      var tries=0, iv=setInterval(function(){ tries++;
        if(document.body.className!=="offline"||tries>20){ clearInterval(iv); return; }
        try{ pywebview.api.get_state().then(function(s){ if(s) kemyState(s); }); }catch(e){}
      },1500);
      // Carrega a VTuber Live2D DEPOIS que o app ja respondeu (nunca trava; SVG fica de reserva)
      setTimeout(loadLive2D, 3000);
    }).catch(function(e){ kemyState('idle'); addMsg('sys','Falha no boot: '+e); });
  }
  window.addEventListener('pywebviewready', boot);
  boot();
  // fallback duro: se em 4s o estado nao saiu de "Conectando", assume pronto
  setTimeout(function(){ if(document.body.className==="offline"||document.body.className===""){ kemyState('idle'); } }, 4000);

  // ---- VTuber Live2D (assincrono; cai pro SVG se falhar) ----
  window._l2dMouth=0;
  window.kemyMouth=function(v){ window._l2dMouth=Math.max(0,Math.min(1,+v||0)); };
  function _loadScript(src){ return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=rej;
    document.head.appendChild(s); }); }
  function loadLive2D(){
    if(window.__l2dStarted) return; window.__l2dStarted=true;
    _loadScript("https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js")
      .then(function(){ return _loadScript("https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"); })
      .then(function(){ return _loadScript("https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"); })
      .then(_startL2D)
      .catch(function(e){ console.log('Live2D libs falharam, mantendo SVG:',e); });
  }
  function _startL2D(){
    try{
      if(!window.PIXI||!window.PIXI.live2d){ return; }
      var MODEL="https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json";
      var W=300,H=340, box=document.getElementById('l2dwrap');
      var app=new PIXI.Application({view:document.getElementById('l2d'),width:W,height:H,backgroundAlpha:0,antialias:true});
      PIXI.live2d.Live2DModel.from(MODEL).then(function(model){
        app.stage.addChild(model);
        box.style.display='flex';
        var sv=document.getElementById('svgAvatar'); if(sv) sv.style.display='none';
        var s=Math.min(W/model.width,H/model.height);
        model.scale.set(s); model.x=(W-model.width*s)/2; model.y=(H-model.height*s)/2;
        app.ticker.add(function(){
          try{ model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', window._l2dMouth); }catch(e){}
        });
      }).catch(function(e){ console.log('Live2D model falhou, usando SVG:',e); });
    }catch(e){ console.log('Live2D init falhou, usando SVG:',e); }
  }
</script>
</body>
</html>
