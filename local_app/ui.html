<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kemy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap');
  :root{
    /* IDENTIDADE "Entardecer": índigo profundo + CORAL quente (assinatura) + lavanda (apoio).
       Calor = companhia — nenhum outro app de IA tem essa cara. */
    --bg:#151517; --bg2:#1d1d20; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.085);
    --line:rgba(255,255,255,.08); --text:#f2f2f4; --muted:#98989f;
    --accent:#9d7bff; --accent2:#c4b0ff; --gold:#e7c66b; --user:#d8ccff;
    --idle:#9d7bff; --listening:#cabbff; --thinking:#7f6bd6; --speaking:#b79aff; --error:#ff6b6b;
    --st:var(--idle); --r:12px;
  }
  /* Tema claro (no <html> pra nao conflitar com as classes de estado do body) */
  html.light{
    /* Entardecer claro: papel quente + coral mais fundo (contraste AA) */
    --bg:#f5f5f7; --bg2:#ececee; --panel:rgba(0,0,0,.045); --panel2:rgba(0,0,0,.07);
    --line:rgba(0,0,0,.10); --text:#1d1d1f; --muted:#6e6e73; --accent:#7a5cf0; --accent2:#a08cf5;
  }
  html.light body{
    background:linear-gradient(180deg,#f7f7f9,#f5f5f7 30%);
  }
  html.light ::-webkit-scrollbar-thumb{background:rgba(16,28,54,.18);background-clip:padding-box}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  /* transicoes suaves entre telas/modais */
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
  [id$="Modal"]>div{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  .menu.open{animation:pop .16s ease}
  .conv,.iconbtn,.wchip,.newbtn,.send{transition:transform .15s ease,background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
  #chat,.stage,.side{transition:opacity .25s ease}
  body{
    font-family:-apple-system,'SF Pro Text','Segoe UI Variable Text','Segoe UI','Inter',system-ui,sans-serif;color:var(--text);
    font-feature-settings:"cv11","ss01";letter-spacing:.1px;-webkit-font-smoothing:antialiased;
    /* fundo ENTARDECER: lavagem coral no horizonte (topo) sobre índigo profundo */
    background:linear-gradient(180deg,#19191c,#151517 30%);
    overflow:hidden;
  }
  /* scrollbars premium */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  ::selection{background:rgba(157,123,255,.32)}
  .app{display:grid;grid-template-columns:248px 1fr;height:100vh}
  /* sidebar */
  .side{background:rgba(0,0,0,.20);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px;backdrop-filter:blur(16px)}
  .side>.iconbtn{border:0;background:none;justify-content:flex-start!important;padding:8px 10px;border-radius:8px;font-size:13px}
  .side>.iconbtn:hover{background:var(--panel2)}
  html.light .side{background:rgba(255,255,255,.55)}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 6px 4px}
  /* a logo é o ÚNICO momento de gradiente — assinatura da marca; o resto fica sóbrio */
  .brand b{font-size:19px;font-weight:800;letter-spacing:-.2px;
    background:linear-gradient(120deg,#fff 8%,#c4b0ff 48%,var(--accent) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  html.light .brand b{background:linear-gradient(120deg,#3a2f6b 5%,#7a5cf0 55%,#9d7bff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand small{color:var(--muted);font-weight:600;letter-spacing:.5px}
  .newbtn{border:0;border-radius:8px;padding:10px;font-weight:600;font-size:13px;color:#fff;cursor:pointer;
    background:var(--accent);transition:.15s}
  .newbtn:hover{filter:brightness(1.08)}
  .lbl{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px;padding:6px 8px 2px}
  .convos{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
  .conv{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 10px;color:var(--muted);cursor:pointer;transition:.15s}
  .conv:hover{background:var(--panel);color:var(--text)}
  .conv.active{background:var(--accent);color:#fff;border-color:transparent}
  .conv .bar{width:3px;align-self:stretch;border-radius:3px;background:transparent}
  .conv.active .bar{background:transparent}
  .conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
  .conv .del{opacity:.5;border:0;background:none;color:inherit;cursor:pointer;font-size:13px}
  .conv .del:hover{opacity:1;color:var(--error)}
  /* main */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.14);backdrop-filter:blur(10px)}
  html.light .top{background:rgba(255,255,255,.5)}
  .top .sp{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--st);transition:.2s}
  .iconbtn{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);border-radius:7px;padding:7px 10px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.15s}
  .ic{width:16px;height:16px;flex:none;stroke-width:2}
  .newbtn,.send,.talk,.tg{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .menu button{display:flex;align-items:center;gap:10px}
  .menu .ic{color:var(--muted)}
  .iconbtn:hover{background:var(--panel2);color:var(--text)}
  .badge{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#ff4d4d;
    box-shadow:0 0 8px #ff4d4d;display:none;animation:pulse 1.2s ease-in-out infinite}
  /* menu "mais opcoes" */
  .menuwrap{position:relative}
  .menu{display:none;position:absolute;right:0;top:46px;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:6px;min-width:230px;z-index:45;box-shadow:0 14px 34px rgba(0,0,0,.55);
    max-height:78vh;overflow-y:auto;overscroll-behavior:contain}
  .menu::-webkit-scrollbar{width:8px}
  .menu::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .menu.open{display:block}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
    color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;
    white-space:nowrap}
  .menu button:hover{background:var(--panel)}
  .menusep{height:1px;background:var(--line);margin:5px 4px}
  .menulbl{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1.4px;padding:9px 12px 3px;text-transform:uppercase}
  /* avatar */
  /* avatar COMPACTO: presença sem roubar a tela do chat (o status ja vive na topbar) */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 2px;gap:4px}
  .avatar{width:132px;height:132px;position:relative}
  .l2dwrap{width:132px;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #l2d{width:100%;height:100%}
  .statelbl{display:none}
  body.overlay .statelbl{display:block;font-size:15px;font-weight:700;color:var(--st);letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
  /* modo overlay: so a VTuber, sobrepondo a tela */
  body.overlay .side,body.overlay .top,body.overlay .chat,body.overlay .composer{display:none!important}
  body.overlay .app{grid-template-columns:1fr}
  body.overlay .main{height:100vh}
  body.overlay .stage{height:100vh;justify-content:center;gap:4px}
  body.overlay .l2dwrap{width:96vw;height:86vh}
  body.overlay .avatar{width:42vh;height:42vh}
  body.overlay .statelbl{font-size:15px}
  #exitMini{display:none}
  body.overlay #exitMini{display:flex;align-items:center;justify-content:center;position:fixed;top:8px;right:8px;z-index:90;
    width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid var(--line);color:#fff;cursor:pointer}
  body.overlay #exitMini:hover{background:rgba(255,80,80,.6)}
  .halo{position:absolute;inset:0;border-radius:50%;border:1px solid var(--st);opacity:.25;box-shadow:none;animation:none}
  body.listening .halo,body.speaking .halo{animation:pulse 1.1s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.05);opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.9}}
  .avatar::after{content:"";position:absolute;inset:-16%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle, var(--st), transparent 62%);opacity:.16;filter:blur(16px);transition:opacity .4s}
  body.speaking .avatar::after{opacity:.36}
  body.thinking .avatar::after{opacity:.26}
  .avatar svg{position:absolute;inset:0;width:100%;height:100%;animation:bob 4s ease-in-out infinite}
  .vtspanel{align-items:center;gap:14px;padding:14px 22px;border-radius:16px;background:rgba(120,90,220,.12);border:1px solid rgba(150,120,255,.3)}
  .vtsface{font-size:42px;animation:bob 4s ease-in-out infinite}
  .vtstxt{font-size:14px;color:#cfc4ff;line-height:1.4}
  .vtstxt small{color:#9a8fc8}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .eye{transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .iris{fill:var(--st);filter:drop-shadow(0 0 4px var(--st))}
  .gem{fill:var(--st);filter:drop-shadow(0 0 5px var(--st));animation:breathe 2.4s ease-in-out infinite}
  .mouth{transform-origin:center;transform:scaleY(.35)}
  body.speaking .mouth{animation:talk .28s steps(2) infinite}
  @keyframes talk{0%{transform:scaleY(.3)}50%{transform:scaleY(1.1)}100%{transform:scaleY(.5)}}
  /* chat */
  .chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 22px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:72%;padding:10px 14px;border-radius:16px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word;animation:rise .25s cubic-bezier(.2,.8,.2,1);user-select:text;-webkit-user-select:text;box-shadow:none}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .msg.user{align-self:flex-end;background:#7c5cf0;border:0;color:#fff;border-bottom-right-radius:5px}
  .msg.kemy{align-self:flex-start;background:rgba(255,255,255,.08);border:0;border-bottom-left-radius:5px}
  .msg.sys{align-self:center;background:rgba(255,255,255,.03);color:var(--muted);font-size:11.5px;font-style:normal;padding:4px 12px;border-radius:20px;border:1px solid var(--line);box-shadow:none;opacity:.85;max-width:88%}
  .msg .save{margin-top:8px;font-size:12px;color:var(--accent2);font-weight:700}
  .msg .copybtn{display:inline-block;margin-top:9px;font-size:11px;font-weight:600;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer;user-select:none}
  .msg .copybtn:hover{color:var(--accent2);border-color:var(--accent2)}
  /* markdown nas respostas da Kemy */
  .msg .mdcode{background:#0b0f14;border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
  html.light .msg .mdcode{background:#0f1522}
  .msg .mdcode-h{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;
    font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8f9ab0;
    background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
  .msg .mdcode pre{margin:0;padding:10px 12px;overflow-x:auto;font-family:Consolas,'Courier New',monospace;
    font-size:12.5px;line-height:1.5;color:#d6deeb;white-space:pre}
  .msg .mdcopy{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
    padding:1px 8px;font-size:10.5px;cursor:pointer;text-transform:none;letter-spacing:0}
  .msg .mdcopy:hover{color:var(--accent2);border-color:var(--accent2)}
  .msg code.mdi{background:rgba(196,176,255,.13);border:1px solid rgba(196,176,255,.24);border-radius:5px;
    padding:1px 6px;font-family:Consolas,'Courier New',monospace;font-size:12.5px}
  .msg b.mdh{display:block;margin:6px 0 2px;font-size:15px}
  .msg a{color:var(--accent2);text-decoration:none;border-bottom:1px dotted var(--accent2)}
  .msg a:hover{filter:brightness(1.15)}
  /* painel "ver ela trabalhar" (checklist ao vivo) */
  .taskpanel{align-self:stretch!important;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-style:normal!important;color:var(--text)}
  .tp-h{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .tp-i{display:flex;align-items:center;gap:10px;padding:4px 0;color:var(--muted);font-size:13.5px;transition:.2s}
  .tp-i .tp-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
  .tp-i.doing{color:var(--text);font-weight:600}
  .tp-i.doing .tp-dot{border-color:var(--accent2);background:var(--accent2);animation:tpp 1s ease-in-out infinite}
  .tp-i.done{color:#8fe388}.tp-i.done .tp-dot{border-color:#8fe388;background:#8fe388}
  .tp-i.fail{color:#ff8c8c}.tp-i.fail .tp-dot{border-color:#ff8c8c}
  @keyframes tpp{0%,100%{box-shadow:0 0 0 0 rgba(34,224,200,.5)}50%{box-shadow:0 0 0 5px rgba(34,224,200,0)}}
  /* tela de boas-vindas elegante (chat vazio) */
  .welcome{margin:auto;max-width:560px;text-align:center;padding:30px 20px;animation:rise .4s ease}
  .welcome h2{font-size:28px;font-weight:700;letter-spacing:-.4px;margin:0 0 8px;color:var(--text)}
  .welcome p{color:var(--muted);margin:0 0 22px;font-size:14.5px;line-height:1.6}
  .wchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .wchip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;
    padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;text-align:left;max-width:250px}
  .wchip:hover{border-color:var(--accent);background:var(--panel2)}
  .wchip b{display:block;color:var(--accent);font-weight:700;margin-bottom:2px}
  /* arquivos alterados (chips clicaveis) */
  .filechips{display:flex!important;flex-wrap:wrap;gap:8px;align-self:flex-start!important;font-style:normal!important;background:none!important}
  .filechip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
  .filechip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .filechip .add{color:#3ddc84;font-weight:800}
  .filechip .rem{color:#ff5b6e;font-weight:800}
  /* modal de codigo/diff */
  #codeModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;align-items:center;justify-content:center}
  .codebox{background:#0b0f17;border:1px solid var(--line);border-radius:14px;width:84%;max-width:940px;height:78vh;display:flex;flex-direction:column;overflow:hidden}
  .codehead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text)}
  .codehead button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .codebody{flex:1;overflow:auto;padding:10px 14px;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.55}
  .dl{white-space:pre-wrap;word-break:break-word}
  .dl.add{background:rgba(61,220,132,.14);color:#a8efc2}
  .dl.rem{background:rgba(255,91,110,.14);color:#ffb4bc}
  .dl.hunk{color:#7c9cff;margin-top:6px}
  /* Preview embutido */
  #previewModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:76;align-items:center;justify-content:center}
  .pvbox{background:#0d1117;border:1px solid var(--line);border-radius:12px;width:92%;max-width:1200px;height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .pvhead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text);background:#161b22}
  .pvhead .sp{flex:1}
  .pvhead button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
  #pvWrap{flex:1;display:flex;justify-content:center;background:#1a1e24;min-height:0}
  .pvframe{border:0;background:#fff;width:100%;height:100%;transition:width .18s}
  .pvdev{background:none!important;border:1px solid transparent!important;opacity:.55;padding:5px 8px!important;
    display:inline-flex;align-items:center;justify-content:center}
  .pvdev.on{opacity:1;border-color:var(--line)!important;background:var(--panel)!important}
  #pvErr{display:none;align-items:center;gap:10px;background:rgba(255,91,110,.12);border-bottom:1px solid rgba(255,91,110,.4);
    color:#ffb4bc;padding:7px 14px;font-size:12.5px;font-family:Consolas,monospace}
  #pvErr>.ic{flex:none;color:#ff5b6e}
  #pvErr .msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pvErr .fixbtn{background:rgba(255,91,110,.22);border:1px solid rgba(255,91,110,.5);color:#fff;border-radius:7px;
    padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  #pvErr .fixbtn:hover{background:rgba(255,91,110,.36)}
  /* IDE estilo VS Code */
  #ideModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:75;align-items:center;justify-content:center}
  .idebox{background:#0d1117;border:1px solid var(--line);border-radius:12px;width:90%;max-width:1100px;height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .idehead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text);background:#161b22}
  .idehead button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .idebody{flex:1;display:flex;min-height:0}
  .idefiles{width:230px;border-right:1px solid var(--line);overflow:auto;padding:6px;background:#0b0f14}
  .idefile{padding:7px 10px;border-radius:6px;color:#aeb6c2;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idefile:hover{background:#1b2129}
  .idefile.sel{background:#1f6feb33;color:#fff}
  .idemain{flex:1;display:flex;flex-direction:column;min-width:0}
  .idetitlebar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:#0f141b}
  .idetitle{flex:1;color:#8b949e;font-size:13px;font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idebtn{background:#21262d;border:1px solid #30363d;color:#e6edf3;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .idebtn:hover{background:#2a313a}
  .idebtn.save{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .idebtn.save:hover{background:#3b82f6}
  .idebtn.save:disabled{opacity:.5;cursor:default}
  .idewrap{flex:1;display:flex;min-height:0;position:relative}
  #ideGutter{width:48px;flex:none;overflow:hidden;background:#0b0f14;color:#4d5566;font-family:Consolas,'Courier New',monospace;
    font-size:13px;line-height:1.55;padding:12px 8px 12px 0;text-align:right;user-select:none;border-right:1px solid #1b2129;white-space:pre}
  /* editor com SYNTAX HIGHLIGHT: <pre> colorido embaixo + textarea…14790 tokens truncated…  function _hesc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function _hlJS(s){
    return s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`?|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|\b(function|return|if|else|for|while|const|let|var|new|class|extends|import|from|export|default|try|catch|finally|throw|typeof|instanceof|async|await|switch|case|break|continue|do|in|of|this|null|undefined|true|false)\b|\b(\d[\d_]*\.?\d*)\b|([A-Za-z_$][\w$]*)(?=\s*\()/g,
      function(m,c,st,kw,nm,fn){ if(c)return '<span class="tok-c">'+m+'</span>';
        if(st)return '<span class="tok-s">'+m+'</span>'; if(kw)return '<span class="tok-k">'+m+'</span>';
        if(nm)return '<span class="tok-n">'+m+'</span>'; if(fn)return '<span class="tok-f">'+m+'</span>'; return m; });
  }
  function _hlCSS(s){
    return s.replace(/(\/\*[\s\S]*?\*\/)|("[^"\n]*"|'[^'\n]*')|(#[0-9a-fA-F]{3,8}\b|\b\d+\.?\d*(?:px|em|rem|%|vh|vw|s|ms|fr)?\b)|([\w-]+)(?=\s*:)|([.#][\w-]+)/g,
      function(m,c,st,nm,pr,sel){ if(c)return '<span class="tok-c">'+m+'</span>';
        if(st)return '<span class="tok-s">'+m+'</span>'; if(nm)return '<span class="tok-n">'+m+'</span>';
        if(pr)return '<span class="tok-a">'+m+'</span>'; if(sel)return '<span class="tok-t">'+m+'</span>'; return m; });
  }
  function _hlHTML(s){
    return s.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?[\w-]+|\/?&gt;)|("[^"\n]*"|'[^'\n]*')|([\w-]+)(?==)/g,
      function(m,c,tg,st,at){ if(c)return '<span class="tok-c">'+m+'</span>';
        if(tg)return '<span class="tok-t">'+m+'</span>'; if(st)return '<span class="tok-s">'+m+'</span>';
        if(at)return '<span class="tok-a">'+m+'</span>'; return m; });
  }
  function _hlPY(s){
    return s.replace(/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|\b(def|class|return|if|elif|else|for|while|import|from|as|with|try|except|finally|raise|pass|break|continue|lambda|None|True|False|and|or|not|in|is|global|nonlocal|yield|async|await|self)\b|(@[\w.]+)|\b(\d[\d_]*\.?\d*)\b/g,
      function(m,c,st,kw,dec,nm){ if(c)return '<span class="tok-c">'+m+'</span>';
        if(st)return '<span class="tok-s">'+m+'</span>'; if(kw)return '<span class="tok-k">'+m+'</span>';
        if(dec)return '<span class="tok-f">'+m+'</span>'; if(nm)return '<span class="tok-n">'+m+'</span>'; return m; });
  }
  var _hlPend=false;
  function _ideHLupd(){
    if(_hlPend)return; _hlPend=true;
    requestAnimationFrame(function(){ _hlPend=false;
      var ed=document.getElementById('ideEditor'), hl=document.getElementById('ideHL');
      var v=ed.value, esc=_hesc(v);
      if(v.length<=150000){                             // arquivo gigante: sem cor (não trava)
        var ext=(_ideRel.split('.').pop()||'').toLowerCase();
        if(['js','jsx','ts','tsx','json','mjs'].indexOf(ext)>=0) esc=_hlJS(esc);
        else if(ext==='css'||ext==='scss') esc=_hlCSS(esc);
        else if(ext==='html'||ext==='htm'||ext==='xml'||ext==='svg'||ext==='vue') esc=_hlHTML(esc);
        else if(ext==='py') esc=_hlPY(esc);
      }
      hl.innerHTML=esc+'\n';                            // \n final: última linha rola certinho
      hl.scrollTop=ed.scrollTop; hl.scrollLeft=ed.scrollLeft;
    });
  }
  function ideNewFile(){
    var box=document.getElementById('ideFiles');
    if(document.getElementById('ideNewRow'))return;
    var row=document.createElement('div'); row.id='ideNewRow'; row.style.cssText='padding:4px 6px';

  function ideReplace(all){
    var ed=document.getElementById('ideEditor');
    var q=(document.getElementById('ideFindQ').value||''), rep=(document.getElementById('ideRepQ').value||'');
    if(!q)return;
    if(all){
      var rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      var n=(ed.value.match(rx)||[]).length;
      if(!n){ document.getElementById('ideFindCnt').textContent='0'; return; }
      ed.value=ed.value.replace(rx,rep);
      document.getElementById('ideFindCnt').textContent=n+' ok';
    } else {
      var sel=ed.value.slice(ed.selectionStart,ed.selectionEnd);
      if(sel.toLowerCase()!==q.toLowerCase()){ ideFindNext(1); return; }   // acha a próxima primeiro
      var s=ed.selectionStart;
      ed.value=ed.value.slice(0,s)+rep+ed.value.slice(ed.selectionEnd);
      ed.selectionStart=ed.selectionEnd=s+rep.length;
      ideFindNext(1);
    }
    _ideDirty(ed.value!==_ideSaved); _ideGut(); _ideStat(); _ideHLupd();
  }
  function _ideStat(){ var ed=document.getElementById('ideEditor');
    var p=ed.selectionStart||0, antes=ed.value.slice(0,p), ln=(antes.match(/\n/g)||[]).length+1, col=p-antes.lastIndexOf('\n');
    document.getElementById('ideLn').textContent='Ln '+ln+', Col '+col;

  function ideReview(){ if(!_ideRel)return; api('ide_review', _ideRel); closeIde(); }
  function ideFindClose(){ document.getElementById('ideFind').style.display='none'; document.getElementById('ideEditor').focus(); }
  function ideFindNext(dir){
    var ed=document.getElementById('ideEditor'), q=(document.getElementById('ideFindQ').value||'');
    if(!q)return;
    var hay=ed.value.toLowerCase(), ndl=q.toLowerCase(), tot=0, i=-1;
    while((i=hay.indexOf(ndl,i+1))>=0)tot++;
    if(!tot){ document.getElementById('ideFindCnt').textContent='0'; return; }
    var pos = dir>0 ? hay.indexOf(ndl, ed.selectionEnd) : hay.lastIndexOf(ndl, Math.max(0,ed.selectionStart-1));
    if(pos<0) pos = dir>0 ? hay.indexOf(ndl) : hay.lastIndexOf(ndl);   // dá a volta
    var atual=0, j=-1; while((j=hay.indexOf(ndl,j+1))>=0 && j<=pos)atual++;
    document.getElementById('ideFindCnt').textContent=atual+'/'+tot;
    ed.setSelectionRange(pos,pos+ndl.length); ed.blur(); ed.focus(); _ideStat();
  }
  (function(){ var ed=document.getElementById('ideEditor'); if(!ed)return;
    var PARES={'(':')','[':']','{':'}','"':'"',"'":"'"};
    ed.addEventListener('input',function(){ _ideDirty(ed.value!==_ideSaved); _ideGut(); _ideStat(); _ideHLupd(); });
    ed.addEventListener('scroll',function(){ document.getElementById('ideGutter').scrollTop=ed.scrollTop;
      var hl=document.getElementById('ideHL'); hl.scrollTop=ed.scrollTop; hl.scrollLeft=ed.scrollLeft; });
    ed.addEventListener('click',_ideStat); ed.addEventListener('keyup',_ideStat);
    ed.addEventListener('keydown',function(e){
      if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='s'){ e.preventDefault(); saveCode(); return; }
      if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='f'){ e.preventDefault();
        var f=document.getElementById('ideFind'); f.style.display='flex';
        var q=document.getElementById('ideFindQ'); q.focus(); q.select(); return; }
      var s=ed.selectionStart, en=ed.selectionEnd;
      if(e.key==='Tab'){ e.preventDefault();
        ed.value=ed.value.slice(0,s)+'  '+ed.value.slice(en); ed.selectionStart=ed.selectionEnd=s+2; }
      else if(e.key==='Enter'){ e.preventDefault();                      // auto-indent
        var lin=ed.value.slice(0,s), ini=lin.lastIndexOf('\n')+1, atual=lin.slice(ini);
        var ind=(atual.match(/^[ \t]*/)||[''])[0];
        if(/[\{\[\(:]\s*$/.test(atual)) ind+='  ';
        ed.value=ed.value.slice(0,s)+'\n'+ind+ed.value.slice(en);
        ed.selectionStart=ed.selectionEnd=s+1+ind.length; }
      else if(PARES[e.key]!==undefined && s!==undefined){                 // auto-fecha ( [ { " '
        var fech=PARES[e.key];
        if(s!==en){ e.preventDefault();                                   // seleção -> embrulha
          ed.value=ed.value.slice(0,s)+e.key+ed.value.slice(s,en)+fech+ed.value.slice(en);
          ed.selectionStart=s+1; ed.selectionEnd=en+1; }
        else if(e.key!=='"'&&e.key!=="'"){ e.preventDefault();            // abre par, cursor no meio
          ed.value=ed.value.slice(0,s)+e.key+fech+ed.value.slice(en);
          ed.selectionStart=ed.selectionEnd=s+1; }
        else return;                                                       // aspas soltas: comportamento normal
      } else return;
      _ideDirty(ed.value!==_ideSaved); _ideGut(); _ideStat(); _ideHLupd();
    });
    var q=document.getElementById('ideFindQ');
    q.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); ideFindNext(e.shiftKey?-1:1); }
      if(e.key==='Escape'){ e.preventDefault(); ideFindClose(); }
    });
  })();

  function setToggle(name,on){ var ids={conv:"tgConv",auto:"tgAuto",boost:"tgBoost"},labs={conv:"Conversa",auto:"Auto",boost:"Capricho"};
    var b=document.getElementById(ids[name]); if(!b)return; b.classList.toggle("on",on);

  var _hist=[], _hi=-1;
  function sendText(){ const i=document.getElementById("inp"); const t=i.value.trim(); if(!t)return;
    _hist.push(t); if(_hist.length>50)_hist.shift(); _hi=_hist.length; i.value=""; api('send_text',t); }
  document.getElementById("inp").addEventListener("keydown",function(e){
    if(e.key==="Enter"){ sendText(); return; }
    var i=document.getElementById("inp");
    if(e.key==="ArrowUp" && !i.value.trim() && _hist.length){ _hi=Math.max(0,_hi-1); i.value=_hist[_hi]||""; e.preventDefault(); }

  });

  // ===== Colar (Ctrl+V) e Arrastar arquivos na caixa de texto =====
  function sendFileToKemy(file){
    if(!file) return;
    if(file.size > 18*1024*1024){ addMsg("sys","Esse arquivo é grande demais (máx ~18MB)."); return; }
    var r=new FileReader();
    r.onload=function(){
      var inp=document.getElementById("inp");
      var prompt=(inp.value||"").trim();
      var nome=file.name||("colado"+(/(png|jpe?g|gif|webp)/i.test(file.type)? (file.type.indexOf("png")>=0?".png":".jpg"):""));
      try{
        if(window.pywebview&&pywebview.api&&pywebview.api.attach_data){
          addMsg("sys","📎 Enviando "+nome+"…");
          pywebview.api.attach_data(nome, r.result, prompt);
          inp.value="";
        }
      }catch(e){ addMsg("sys","Não consegui anexar: "+e); }
    };
    r.onerror=function(){ addMsg("sys","Falha ao ler o arquivo."); };
    r.readAsDataURL(file);
  }
  // Colar imagem (ou arquivo) do clipboard
  document.getElementById("inp").addEventListener("paste",function(e){
    var items=(e.clipboardData||{}).items||[]; var achou=false;
    for(var i=0;i<items.length;i++){ if(items[i].kind==="file"){ var f=items[i].getAsFile(); if(f){ sendFileToKemy(f); achou=true; } } }
    if(achou) e.preventDefault();   // tinha arquivo -> nao cola caminho/binario como texto
  });
  // Arrastar e soltar (na caixa ou em qualquer lugar da janela)
  (function(){
    var comp=document.querySelector(".composer")||document.body;
    function stop(e){ e.preventDefault(); e.stopPropagation(); }
    ["dragenter","dragover"].forEach(function(ev){ window.addEventListener(ev,function(e){ stop(e);
      if(comp&&comp.classList) comp.classList.add("dragover"); }); });
    ["dragleave","drop"].forEach(function(ev){ window.addEventListener(ev,function(e){ stop(e);
      if(comp&&comp.classList) comp.classList.remove("dragover"); }); });
    window.addEventListener("drop",function(e){
      var files=(e.dataTransfer||{}).files||[];
      for(var i=0;i<files.length;i++) sendFileToKemy(files[i]);
    });
  })();
  // Esc fecha qualquer modal; clicar fora (no fundo) tambem fecha.

  // boot — robusto: funciona mesmo se 'pywebviewready' disparar antes do listener
  var _booted=false;
  function boot(){
    if(_booted) return;
    if(!(window.pywebview && window.pywebview.api && pywebview.api.bootstrap)){ return setTimeout(boot,150); }
    _booted=true;
    pywebview.api.bootstrap().then(function(st){
      renderConvos(st.convos,st.active); kemyState(st.state||"idle");
      (st.log||[]).forEach(function(m){ addMsg(m.r,m.t); });
      if(!(st.log&&st.log.length)) showWelcome();
      // rede de seguranca: se continuar "Conectando", consulta o estado
      var tries=0, iv=setInterval(function(){ tries++;
        if(document.body.className!=="offline"||tries>20){ clearInterval(iv); return; }
        try{ pywebview.api.get_state().then(function(s){ if(s) kemyState(s); }); }catch(e){}
      },1500);
      // Carrega a VTuber Live2D DEPOIS que o app ja respondeu (nunca trava; SVG fica de reserva)
      setTimeout(loadLive2D, 3000);
    }).catch(function(e){ kemyState('idle'); addMsg('sys','Falha no boot: '+e); });
  }
  window.addEventListener('pywebviewready', boot);
  showWelcome();
  boot();
  // fallback duro: nunca ficar preso em "Conectando". Se nao entrou num estado ativo, assume pronto.
  setTimeout(function(){ var c=document.body.className;
    if(c==="idle"||c==="offline"||c===""){ kemyState('idle'); } }, 3500);
  setTimeout(function(){ if(!_booted){ try{ boot(); }catch(e){} } }, 5000);

  // ---- VTuber Live2D (assincrono; cai pro SVG se falhar) ----
  window._l2dMouth=0;
  window.kemyMouth=function(v){ window._l2dMouth=Math.max(0,Math.min(1,+v||0)); };
  window.setOverlay=function(on){
    document.body.classList.toggle('overlay', !!on);
    setTimeout(function(){ try{
      if(window._l2dApp){ var box=document.getElementById('l2dwrap');
        window._l2dApp.renderer.resize(box.clientWidth, box.clientHeight);
        if(window._l2dFit) window._l2dFit(); }
    }catch(e){} }, 90);
  };
  function _loadScript(src){ return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=rej;
    document.head.appendChild(s); }); }
  function loadLive2D(){
    if(window.__l2dStarted) return; window.__l2dStarted=true;
    _loadScript("https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js")
      .then(function(){ return _loadScript("https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"); })
      .then(function(){ return _loadScript("https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"); })
      .then(_startL2D)
      .catch(function(e){ console.log('Live2D libs falharam, mantendo SVG:',e); });
  }
  function _startL2D(){
    try{
      if(!window.PIXI||!window.PIXI.live2d){ return; }
      var MODEL="https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json";
      var W=190,H=220, box=document.getElementById('l2dwrap');
      var app=new PIXI.Application({view:document.getElementById('l2d'),width:W,height:H,backgroundAlpha:0,antialias:true});
      window._l2dApp=app;
      PIXI.live2d.Live2DModel.from(MODEL).then(function(model){
        app.stage.addChild(model);
        box.style.display='flex';
        var sv=document.getElementById('svgAvatar'); if(sv) sv.style.display='none';
        window._l2dModel=model;
        window._l2dFit=function(){ var w=app.renderer.width,h=app.renderer.height;
          model.anchor.set(0.5,0.0); var s=(w/model.width)*1.3; model.scale.set(s); model.x=w/2; model.y=-h*0.05; };
        window._l2dFit();
        app.ticker.add(function(){
          try{ model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', window._l2dMouth); }catch(e){}
        });
      }).catch(function(e){ console.log('Live2D model falhou, usando SVG:',e); });
    }catch(e){ console.log('Live2D init falhou, usando SVG:',e); }
  }
