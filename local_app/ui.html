<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kemy</title>
<style>
  :root{
    --bg:#070a12; --bg2:#0b1020; --panel:rgba(255,255,255,.04); --panel2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.08); --text:#eaf0ff; --muted:#8a98b8;
    --accent:#7c5cff; --accent2:#22e0c8; --user:#9fe7d2;
    --idle:#22e0c8; --listening:#5ab0ff; --thinking:#ffc857; --speaking:#b98bff; --error:#ff6b6b;
    --st:var(--idle);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(34,224,200,.12), transparent 60%),
      linear-gradient(160deg,#070a12,#0b1020);
    overflow:hidden;
  }
  .app{display:grid;grid-template-columns:248px 1fr;height:100vh}
  /* sidebar */
  .side{background:rgba(0,0,0,.25);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
  .brand b{font-size:20px;letter-spacing:.5px}
  .brand small{color:var(--muted)}
  .newbtn{border:0;border-radius:14px;padding:12px;font-weight:700;color:#08111a;cursor:pointer;
    background:linear-gradient(135deg,var(--accent2),#5ad8ff);box-shadow:0 8px 24px rgba(34,224,200,.25);transition:.2s}
  .newbtn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .lbl{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px;padding:4px 6px}
  .convos{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
  .conv{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 10px;color:var(--muted);cursor:pointer;transition:.15s}
  .conv:hover{background:var(--panel);color:var(--text)}
  .conv.active{background:var(--panel2);color:var(--text);border-color:var(--line)}
  .conv .bar{width:3px;align-self:stretch;border-radius:3px;background:transparent}
  .conv.active .bar{background:linear-gradient(var(--accent),var(--accent2))}
  .conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
  .conv .del{opacity:.5;border:0;background:none;color:inherit;cursor:pointer;font-size:13px}
  .conv .del:hover{opacity:1;color:var(--error)}
  /* main */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;overflow:hidden}
  .top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .top .sp{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--st);box-shadow:0 0 12px var(--st);transition:.2s}
  .iconbtn{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;transition:.15s}
  .ic{width:16px;height:16px;flex:none;stroke-width:2}
  .newbtn,.send,.talk,.tg{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .menu button{display:flex;align-items:center;gap:10px}
  .menu .ic{color:var(--muted)}
  .iconbtn:hover{background:var(--panel2);color:var(--text);transform:translateY(-1px)}
  .badge{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#ff4d4d;
    box-shadow:0 0 8px #ff4d4d;display:none;animation:pulse 1.2s ease-in-out infinite}
  /* menu "mais opcoes" */
  .menuwrap{position:relative}
  .menu{display:none;position:absolute;right:0;top:46px;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:6px;min-width:230px;z-index:45;box-shadow:0 14px 34px rgba(0,0,0,.55)}
  .menu.open{display:block}
  .menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
  .menu button:hover{background:var(--panel)}
  .menusep{height:1px;background:var(--line);margin:5px 4px}
  /* avatar */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0 8px;gap:6px}
  .avatar{width:210px;height:210px;position:relative}
  .l2dwrap{width:190px;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #l2d{width:100%;height:100%}
  .statelbl{font-size:13px;font-weight:700;color:var(--st);letter-spacing:.4px;opacity:.9}
  /* modo overlay: so a VTuber, sobrepondo a tela */
  body.overlay .side,body.overlay .top,body.overlay .chat,body.overlay .composer{display:none!important}
  body.overlay .app{grid-template-columns:1fr}
  body.overlay .main{height:100vh}
  body.overlay .stage{height:100vh;justify-content:center;gap:4px}
  body.overlay .l2dwrap{width:96vw;height:86vh}
  body.overlay .avatar{width:42vh;height:42vh}
  body.overlay .statelbl{font-size:15px}
  #exitMini{display:none}
  body.overlay #exitMini{display:flex;align-items:center;justify-content:center;position:fixed;top:8px;right:8px;z-index:90;
    width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid var(--line);color:#fff;cursor:pointer}
  body.overlay #exitMini:hover{background:rgba(255,80,80,.6)}
  .halo{position:absolute;inset:0;border-radius:50%;border:2px solid var(--st);opacity:.5;
    box-shadow:0 0 30px var(--st);animation:breathe 3.5s ease-in-out infinite}
  body.listening .halo,body.speaking .halo{animation:pulse 1.1s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.05);opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:.9}}
  .avatar svg{position:absolute;inset:0;width:100%;height:100%;animation:bob 4s ease-in-out infinite}
  .vtspanel{align-items:center;gap:14px;padding:14px 22px;border-radius:16px;background:rgba(120,90,220,.12);border:1px solid rgba(150,120,255,.3)}
  .vtsface{font-size:42px;animation:bob 4s ease-in-out infinite}
  .vtstxt{font-size:14px;color:#cfc4ff;line-height:1.4}
  .vtstxt small{color:#9a8fc8}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .eye{transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .iris{fill:var(--st);filter:drop-shadow(0 0 4px var(--st))}
  .gem{fill:var(--st);filter:drop-shadow(0 0 5px var(--st));animation:breathe 2.4s ease-in-out infinite}
  .mouth{transform-origin:center;transform:scaleY(.35)}
  body.speaking .mouth{animation:talk .28s steps(2) infinite}
  @keyframes talk{0%{transform:scaleY(.3)}50%{transform:scaleY(1.1)}100%{transform:scaleY(.5)}}
  /* chat */
  .chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 22px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.55;font-size:14px;white-space:pre-wrap;word-wrap:break-word;animation:rise .25s ease;user-select:text;-webkit-user-select:text}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,224,200,.12));border:1px solid var(--line)}
  .msg.kemy{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;font-style:italic;padding:2px}
  .msg .save{margin-top:8px;font-size:12px;color:var(--accent2);font-weight:700}
  .msg .copybtn{display:inline-block;margin-top:9px;font-size:11px;font-weight:600;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer;user-select:none}
  .msg .copybtn:hover{color:var(--accent2);border-color:var(--accent2)}
  /* arquivos alterados (chips clicaveis) */
  .filechips{display:flex!important;flex-wrap:wrap;gap:8px;align-self:flex-start!important;font-style:normal!important;background:none!important}
  .filechip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
  .filechip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .filechip .add{color:#3ddc84;font-weight:800}
  .filechip .rem{color:#ff5b6e;font-weight:800}
  /* modal de codigo/diff */
  #codeModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;align-items:center;justify-content:center}
  .codebox{background:#0b0f17;border:1px solid var(--line);border-radius:14px;width:84%;max-width:940px;height:78vh;display:flex;flex-direction:column;overflow:hidden}
  .codehead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text)}
  .codehead button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .codebody{flex:1;overflow:auto;padding:10px 14px;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.55}
  .dl{white-space:pre-wrap;word-break:break-word}
  .dl.add{background:rgba(61,220,132,.14);color:#a8efc2}
  .dl.rem{background:rgba(255,91,110,.14);color:#ffb4bc}
  .dl.hunk{color:#7c9cff;margin-top:6px}
  /* Preview embutido */
  #previewModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:76;align-items:center;justify-content:center}
  .pvbox{background:#0d1117;border:1px solid var(--line);border-radius:12px;width:92%;max-width:1200px;height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .pvhead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text);background:#161b22}
  .pvhead .sp{flex:1}
  .pvhead button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
  .pvframe{flex:1;border:0;background:#fff;width:100%}
  /* IDE estilo VS Code */
  #ideModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:75;align-items:center;justify-content:center}
  .idebox{background:#0d1117;border:1px solid var(--line);border-radius:12px;width:90%;max-width:1100px;height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .idehead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--text);background:#161b22}
  .idehead button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
  .idebody{flex:1;display:flex;min-height:0}
  .idefiles{width:230px;border-right:1px solid var(--line);overflow:auto;padding:6px;background:#0b0f14}
  .idefile{padding:7px 10px;border-radius:6px;color:#aeb6c2;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idefile:hover{background:#1b2129}
  .idefile.sel{background:#1f6feb33;color:#fff}
  .idemain{flex:1;display:flex;flex-direction:column;min-width:0}
  .idetitle{padding:8px 14px;border-bottom:1px solid var(--line);color:#8b949e;font-size:13px;font-family:Consolas,monospace}
  .idepre{flex:1;overflow:auto;padding:8px 0;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.5}
  .cline{display:flex}
  .cn{width:50px;flex:none;text-align:right;padding-right:14px;color:#4d5566;user-select:none}
  .cc{white-space:pre;color:#d6deeb}
  /* composer */
  .composer{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:10px;align-items:center}
  .input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--text);font-size:14px;outline:none;transition:.15s}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
  .send{border:0;border-radius:14px;padding:13px 22px;font-weight:700;color:#08111a;cursor:pointer;background:linear-gradient(135deg,var(--accent2),#5ad8ff);transition:.2s}
  .send:hover{transform:translateY(-2px)}
  .toggles{display:flex;gap:8px;align-items:center}
  .talk{border:0;border-radius:12px;padding:11px 20px;font-weight:700;color:#08111a;cursor:pointer;background:linear-gradient(135deg,var(--listening),#7cc4ff);transition:.2s}
  .talk:hover{transform:translateY(-2px)}
  .tg{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
  .tg.on{color:#08111a}
  .tg.conv.on{background:var(--accent2)}
  .tg.auto.on{background:var(--thinking)}
  .tg.boost.on{background:#ffce47}
  .tg.mute{margin-left:auto}
  .chat::-webkit-scrollbar,.convos::-webkit-scrollbar{width:12px}
  .chat::-webkit-scrollbar-track,.convos::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
  .chat::-webkit-scrollbar-thumb,.convos::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  .chat::-webkit-scrollbar-thumb:hover,.convos::-webkit-scrollbar-thumb:hover{background:var(--accent2)}
</style>
</head>
<body class="idle">
  <div class="app">
    <aside class="side">
      <div class="brand"><b>Kemy</b><small>· local</small></div>
      <button class="newbtn" onclick="api('new_convo')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nova conversa</button>
      <div class="lbl">CONVERSAS</div>
      <div class="convos" id="convos"></div>
      <button class="iconbtn" style="width:100%;justify-content:center" onclick="api('browse_project')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Ver código</button>
      <button class="iconbtn" style="width:100%;justify-content:center" onclick="api('choose_workspace')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Escolher pasta</button>
      <button class="iconbtn" style="width:100%;justify-content:center" onclick="api('open_folder')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2"/><path d="M3 9h18l-2 9a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 18z"/></svg>Abrir pasta</button>
    </aside>
    <section class="main">
      <div class="top">
        <span class="pill"><span class="dot"></span><span id="stateTxt">Conectando…</span></span>
        <span class="sp"></span>
        <button class="iconbtn" onclick="api('see_screen')" title="A Kemy olha sua tela"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>Ver tela</button>
        <div class="menuwrap">
          <button class="iconbtn" onclick="toggleMenu()" title="Mais opções"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="badge" id="updBadge"></span></button>
          <div class="menu" id="menu">
            <button onclick="openVoice();closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>Voz da Kemy</button>
            <button onclick="api('preview');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>Ver o site (preview)</button>
            <button onclick="api('deploy_site');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v13"/><path d="M6 8l6-6 6 6"/><path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>Publicar site (no ar)</button>
            <button onclick="api('toggle_pet');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>Mascote flutuante (mostrar/ocultar)</button>
            <button onclick="api('show_obs_url');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Overlay pro OBS (transparente)</button>
            <button onclick="api('vts_connect');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg>Conectar VTube Studio</button>
            <button onclick="api('vts_test');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9.5" x2="9.01" y2="9.5"/><line x1="15" y1="9.5" x2="15.01" y2="9.5"/></svg>Testar boca (VTS)</button>
            <button onclick="api('git_undo');closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>Desfazer última alteração</button>
            <div class="menusep"></div>
            <button id="updItem" onclick="doUpdate();closeMenu()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg><span class="lab">Atualizar a Kemy</span></button>
          </div>
        </div>
      </div>
      <div class="stage">
        <div class="l2dwrap" id="l2dwrap" style="display:none"><canvas id="l2d"></canvas></div>
        <div class="avatar" id="svgAvatar">
          <div class="halo"></div>
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <!-- cabelo de tras -->
            <path d="M40 96 Q28 180 70 168 Q100 182 130 168 Q172 180 160 96 Q150 30 100 26 Q50 30 40 96Z" fill="#1a1030"/>
            <!-- rosto -->
            <ellipse cx="100" cy="104" rx="42" ry="50" fill="#ece1f2"/>
            <!-- pods -->
            <rect x="48" y="96" width="14" height="34" rx="7" fill="#120a1f"/>
            <rect x="138" y="96" width="14" height="34" rx="7" fill="#120a1f"/>
            <circle cx="55" cy="113" r="5" class="iris"/><circle cx="145" cy="113" r="5" class="iris"/>
            <!-- franja cobrindo a coroa -->
            <path d="M55 96 Q44 36 100 30 Q156 36 145 96 Q132 70 116 78 Q100 104 84 78 Q68 70 55 96Z" fill="#211433"/>
            <!-- gema -->
            <path d="M100 64 l6 7 l-6 8 l-6 -8 Z" class="gem"/>
            <!-- delineado -->
            <path d="M74 100 q10 -7 22 -2" stroke="#120a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M104 98 q12 -5 22 2" stroke="#120a1f" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- olhos -->
            <g class="eye"><ellipse cx="85" cy="110" rx="9" ry="10" fill="#f3ecff"/><circle class="iris" cx="85" cy="110" r="5.5"/><circle cx="87" cy="108" r="1.8" fill="#fff"/></g>
            <g class="eye"><ellipse cx="115" cy="110" rx="9" ry="10" fill="#f3ecff"/><circle class="iris" cx="115" cy="110" r="5.5"/><circle cx="117" cy="108" r="1.8" fill="#fff"/></g>
            <!-- blush -->
            <ellipse cx="80" cy="126" rx="6" ry="3" fill="#b06a8f" opacity=".6"/>
            <ellipse cx="120" cy="126" rx="6" ry="3" fill="#b06a8f" opacity=".6"/>
            <!-- boca -->
            <ellipse class="mouth" cx="100" cy="136" rx="7" ry="5" fill="#6e2440"/>
          </svg>
        </div>
        <div class="statelbl" id="statelbl">Pronta</div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="composer">
        <div class="row">
          <button class="iconbtn" title="Anexar arquivo (imagem, PDF, vídeo, Excel, CSV…)" onclick="api('attach_file', document.getElementById('inp').value)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></button>
          <input class="input" id="inp" placeholder="Peça algo: crie um site, edite o código, abra um app…" />
          <button class="send" onclick="sendText()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Enviar</button>
        </div>
        <div class="toggles">
          <button class="talk" id="talk" onclick="api('listen')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>Falar</button>
          <button class="tg conv" id="tgConv" onclick="toggle('conv')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-8 8H7l-4 3v-11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg><span class="lab">Conversa</span></button>
          <button class="tg auto" id="tgAuto" onclick="toggle('auto')"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 4 14 11 14 10 22 20 10 13 10"/></svg><span class="lab">Auto</span></button>
          <button class="tg boost on" id="tgBoost" onclick="toggle('boost')" title="Autorrevisão do código (qualidade nível pro)"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg><span class="lab">Capricho: ON</span></button>
          <button class="tg mute" onclick="api('stop_speak')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 3 9 3 15 6 15 11 19" fill="currentColor"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>Silenciar</button>
        </div>
      </div>
    </section>
  </div>
  <div id="previewModal">
    <div class="pvbox">
      <div class="pvhead"><span>👁 Preview do site</span><span class="sp"></span>
        <button onclick="pvReload()" title="Recarregar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg></button>
        <button onclick="pvExternal()" title="Abrir no navegador">Navegador</button>
        <button onclick="closePreview()">✕</button>
      </div>
      <iframe id="pvFrame" class="pvframe"></iframe>
    </div>
  </div>
  <div id="ideModal">
    <div class="idebox">
      <div class="idehead"><span>🗂️ Código do projeto</span><button onclick="closeIde()">✕</button></div>
      <div class="idebody">
        <div class="idefiles" id="ideFiles"></div>
        <div class="idemain"><div class="idetitle" id="ideTitle">selecione um arquivo</div><div class="idepre" id="ideContent"></div></div>
      </div>
    </div>
  </div>
  <div id="codeModal">
    <div class="codebox">
      <div class="codehead"><span id="codeTitle"></span><button onclick="closeCode()">✕</button></div>
      <div id="codeBody" class="codebody"></div>
    </div>
  </div>
  <div id="voiceModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;align-items:center;justify-content:center">
    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:24px;width:440px;max-width:92%">
      <h3 style="margin:0 0 6px">🎙️ Voz personalizada (ElevenLabs)</h3>
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Cole a chave da API e o Voice ID. Deixe o ID vazio para usar a voz padrão.</p>
      <input id="vKey" class="input" placeholder="Chave da API (xi-api-key)" style="width:100%;margin-bottom:10px;box-sizing:border-box"/>
      <input id="vVoice" class="input" placeholder="Voice ID (ex.: 33B4UnXyTNbgLmdEDh5P)" style="width:100%;margin-bottom:16px;box-sizing:border-box"/>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="tg" onclick="closeVoice()">Cancelar</button>
        <button class="send" onclick="saveVoice()">Salvar e testar</button>
      </div>
    </div>
  </div>
<script>
  function openVoice(){ document.getElementById('voiceModal').style.display='flex'; }
  function closeVoice(){ document.getElementById('voiceModal').style.display='none'; }
  function saveVoice(){ var k=document.getElementById('vKey').value.trim(), v=document.getElementById('vVoice').value.trim();
    if(!k){ return; } api('set_voice', k+'|'+v); closeVoice(); }
</script>
<script>
  const STATE_TXT={idle:"Pronta",listening:"Ouvindo…",thinking:"Pensando…",speaking:"Falando…",offline:"Conectando…",error:"Erro"};
  function api(name,arg){ if(!(window.pywebview&&pywebview.api&&pywebview.api[name]))return;
    return arg===undefined?pywebview.api[name]():pywebview.api[name](arg); }
  function kemyState(s){ document.body.className=s;
    document.getElementById("stateTxt").textContent=STATE_TXT[s]||s;
    var l=document.getElementById("statelbl"); if(l) l.textContent=STATE_TXT[s]||s; }
  function vtsConnected(){ /* o rosto e a carinha do app; nao escondemos mais */ }
  function copyText(btn,text){
    function done(){ var o=btn.textContent; btn.textContent='✓ Copiado'; setTimeout(function(){btn.textContent=o;},1200); }
    function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); done(); }catch(e){} }
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,fallback); } else fallback(); }
    catch(e){ fallback(); }
  }
  function addCopyBtn(el,text){
    var b=document.createElement('button'); b.className='copybtn'; b.textContent='⧉ Copiar';
    b.onclick=function(ev){ ev.stopPropagation(); copyText(b,text); };
    el.appendChild(b);
  }
  function addMsg(role,text,save){
    const c=document.getElementById("chat");
    const d=document.createElement("div"); d.className="msg "+role;
    d.textContent=text;
    if(save){const s=document.createElement("div");s.className="save";s.textContent="💾 "+save;d.appendChild(s);}
    if(role==="kemy"||role==="user"){ addCopyBtn(d,text); }
    c.appendChild(d); c.scrollTop=c.scrollHeight;
  }
  function clearChat(){document.getElementById("chat").innerHTML="";}
  var _streamEl=null;
  function startStream(){ var c=document.getElementById("chat");
    _streamEl=document.createElement("div"); _streamEl.className="msg kemy"; _streamEl.textContent="";
    c.appendChild(_streamEl); c.scrollTop=c.scrollHeight; }
  function streamChunk(delta){ if(!_streamEl)startStream();
    _streamEl.textContent+=delta; var c=document.getElementById("chat"); c.scrollTop=c.scrollHeight; }
  function endStream(){ if(_streamEl){ addCopyBtn(_streamEl, _streamEl.textContent); } _streamEl=null; }
  function showFiles(list){
    const c=document.getElementById("chat");
    const d=document.createElement("div"); d.className="msg sys filechips";
    (list||[]).forEach(function(f){
      const b=document.createElement("button"); b.className="filechip";
      b.innerHTML='📄 '+f.path+' <span class="add">+'+f.added+'</span> <span class="rem">-'+f.removed+'</span>';
      b.onclick=function(){ viewFile(f.key); };
      d.appendChild(b);
    });
    c.appendChild(d); c.scrollTop=c.scrollHeight;
  }
  function viewFile(key){
    if(!(window.pywebview&&pywebview.api&&pywebview.api.get_file_view))return;
    pywebview.api.get_file_view(key).then(function(v){
      if(!v||!v.path)return;
      document.getElementById('codeTitle').textContent=v.path+'  ( +'+v.added+'  -'+v.removed+' )';
      var body=document.getElementById('codeBody'); body.innerHTML='';
      var txt=(v.diff&&v.diff.trim())?v.diff:(v.content||'');
      var showDiff=!!(v.diff&&v.diff.trim());
      txt.split('\n').forEach(function(ln){
        var s=document.createElement('div'); s.className='dl'; s.textContent=ln;
        if(showDiff){
          if(ln.indexOf('+')===0&&ln.indexOf('+++')!==0) s.className='dl add';
          else if(ln.indexOf('-')===0&&ln.indexOf('---')!==0) s.className='dl rem';
          else if(ln.indexOf('@@')===0) s.className='dl hunk';
        }
        body.appendChild(s);
      });
      document.getElementById('codeModal').style.display='flex';
    });
  }
  function closeCode(){ document.getElementById('codeModal').style.display='none'; }
  function showProjectFiles(list){
    var box=document.getElementById('ideFiles'); box.innerHTML='';
    (list||[]).forEach(function(f){
      var d=document.createElement('div'); d.className='idefile'; d.textContent=f.path; d.title=f.path;
      d.onclick=function(){ document.querySelectorAll('.idefile').forEach(function(x){x.classList.remove('sel');}); d.classList.add('sel'); viewProjectFile(f.path); };
      box.appendChild(d);
    });
    document.getElementById('ideModal').style.display='flex';
    if(list&&list.length){ box.firstChild.classList.add('sel'); viewProjectFile(list[0].path); }
  }
  function viewProjectFile(rel){
    if(!(window.pywebview&&pywebview.api&&pywebview.api.read_project_file))return;
    pywebview.api.read_project_file(rel).then(function(v){
      if(!v||!v.path)return;
      document.getElementById('ideTitle').textContent=v.path;
      var pre=document.getElementById('ideContent'); pre.innerHTML='';
      (v.content||'').split('\n').forEach(function(ln,i){
        var row=document.createElement('div'); row.className='cline';
        var n=document.createElement('span'); n.className='cn'; n.textContent=(i+1);
        var c=document.createElement('span'); c.className='cc'; c.textContent=(ln!==''?ln:' ');
        row.appendChild(n); row.appendChild(c); pre.appendChild(row);
      });
      pre.scrollTop=0;
    });
  }
  function closeIde(){ document.getElementById('ideModal').style.display='none'; }
  var _pvUrl="";
  function showPreview(url){ _pvUrl=url; document.getElementById('pvFrame').src=url;
    document.getElementById('previewModal').style.display='flex'; }
  function pvReload(){ var f=document.getElementById('pvFrame'); if(f&&_pvUrl) f.src=_pvUrl+(_pvUrl.indexOf('?')<0?'?':'&')+'_r='+Date.now(); }
  function pvExternal(){ try{ pywebview.api.open_preview_external(); }catch(e){} }
  function closePreview(){ var f=document.getElementById('pvFrame'); if(f)f.src='about:blank'; document.getElementById('previewModal').style.display='none'; }
  function renderConvos(list,active){
    const box=document.getElementById("convos"); box.innerHTML="";
    list.forEach(it=>{
      const d=document.createElement("div"); d.className="conv"+(it.id===active?" active":"");
      d.innerHTML='<span class="bar"></span><span class="t"></span><button class="del" title="Apagar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>';
      d.querySelector(".t").textContent=it.title||"Nova conversa";
      d.onclick=e=>{ if(e.target.closest(".del")){api('delete_convo',it.id);} else {api('select_convo',it.id);} };
      box.appendChild(d);
    });
  }
  function setToggle(name,on){ var ids={conv:"tgConv",auto:"tgAuto",boost:"tgBoost"},labs={conv:"Conversa",auto:"Auto",boost:"Capricho"};
    var b=document.getElementById(ids[name]); if(!b)return; b.classList.toggle("on",on);
    var lab=b.querySelector(".lab"); if(lab) lab.textContent=(labs[name]||name)+(on?": ON":""); }
  function toggle(name){ api('toggle',name); }
  function sendText(){ const i=document.getElementById("inp"); const t=i.value.trim(); if(!t)return; i.value=""; api('send_text',t); }
  document.getElementById("inp").addEventListener("keydown",e=>{ if(e.key==="Enter")sendText(); });
  function doUpdate(){ addMsg("sys","Procurando atualização…"); api('check_update'); }
  function setUpdate(av){ const b=document.getElementById("updBadge"); if(b)b.style.display=av?"block":"none";
    const it=document.querySelector("#updItem .lab"); if(it)it.textContent=av?"Atualizar (nova versão!)":"Atualizar a Kemy"; }
  function toggleMenu(){ document.getElementById("menu").classList.toggle("open"); }
  function closeMenu(){ document.getElementById("menu").classList.remove("open"); }
  document.addEventListener("click",function(e){ var w=document.querySelector(".menuwrap");
    if(w&&!w.contains(e.target)) closeMenu(); });
  // boot — robusto: funciona mesmo se 'pywebviewready' disparar antes do listener
  var _booted=false;
  function boot(){
    if(_booted) return;
    if(!(window.pywebview && window.pywebview.api && pywebview.api.bootstrap)){ return setTimeout(boot,150); }
    _booted=true;
    pywebview.api.bootstrap().then(function(st){
      renderConvos(st.convos,st.active); kemyState(st.state||"idle");
      (st.log||[]).forEach(function(m){ addMsg(m.r,m.t); });
      // rede de seguranca: se continuar "Conectando", consulta o estado
      var tries=0, iv=setInterval(function(){ tries++;
        if(document.body.className!=="offline"||tries>20){ clearInterval(iv); return; }
        try{ pywebview.api.get_state().then(function(s){ if(s) kemyState(s); }); }catch(e){}
      },1500);
      // Carrega a VTuber Live2D DEPOIS que o app ja respondeu (nunca trava; SVG fica de reserva)
      setTimeout(loadLive2D, 3000);
    }).catch(function(e){ kemyState('idle'); addMsg('sys','Falha no boot: '+e); });
  }
  window.addEventListener('pywebviewready', boot);
  boot();
  // fallback duro: nunca ficar preso em "Conectando". Se nao entrou num estado ativo, assume pronto.
  setTimeout(function(){ var c=document.body.className;
    if(c==="idle"||c==="offline"||c===""){ kemyState('idle'); } }, 3500);
  setTimeout(function(){ if(!_booted){ try{ boot(); }catch(e){} } }, 5000);

  // ---- VTuber Live2D (assincrono; cai pro SVG se falhar) ----
  window._l2dMouth=0;
  window.kemyMouth=function(v){ window._l2dMouth=Math.max(0,Math.min(1,+v||0)); };
  window.setOverlay=function(on){
    document.body.classList.toggle('overlay', !!on);
    setTimeout(function(){ try{
      if(window._l2dApp){ var box=document.getElementById('l2dwrap');
        window._l2dApp.renderer.resize(box.clientWidth, box.clientHeight);
        if(window._l2dFit) window._l2dFit(); }
    }catch(e){} }, 90);
  };
  function _loadScript(src){ return new Promise(function(res,rej){
    var s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=rej;
    document.head.appendChild(s); }); }
  function loadLive2D(){
    if(window.__l2dStarted) return; window.__l2dStarted=true;
    _loadScript("https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js")
      .then(function(){ return _loadScript("https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"); })
      .then(function(){ return _loadScript("https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"); })
      .then(_startL2D)
      .catch(function(e){ console.log('Live2D libs falharam, mantendo SVG:',e); });
  }
  function _startL2D(){
    try{
      if(!window.PIXI||!window.PIXI.live2d){ return; }
      var MODEL="https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json";
      var W=190,H=220, box=document.getElementById('l2dwrap');
      var app=new PIXI.Application({view:document.getElementById('l2d'),width:W,height:H,backgroundAlpha:0,antialias:true});
      window._l2dApp=app;
      PIXI.live2d.Live2DModel.from(MODEL).then(function(model){
        app.stage.addChild(model);
        box.style.display='flex';
        var sv=document.getElementById('svgAvatar'); if(sv) sv.style.display='none';
        window._l2dModel=model;
        window._l2dFit=function(){ var w=app.renderer.width,h=app.renderer.height;
          model.anchor.set(0.5,0.0); var s=(w/model.width)*1.3; model.scale.set(s); model.x=w/2; model.y=-h*0.05; };
        window._l2dFit();
        app.ticker.add(function(){
          try{ model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', window._l2dMouth); }catch(e){}
        });
      }).catch(function(e){ console.log('Live2D model falhou, usando SVG:',e); });
    }catch(e){ console.log('Live2D init falhou, usando SVG:',e); }
  }
</script>
</body>
</html>
